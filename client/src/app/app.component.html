<main class="container">
  <h1>Task Manager</h1>

  <section class="panel">
    <h2>Create Task</h2>
    <app-create-task (created)="handleCreated($event)" />
  </section>

  <section class="panel">
    <h2>Tasks</h2>
    <app-task-list [tasks]="tasks()" (markDone)="handleMarkDone($event)" />
  </section>
</main>
